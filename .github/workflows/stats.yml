name: Update Stats

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-readme-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate readme stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: >-
            {
              "username": "${{ github.repository_owner }}",
              "theme": "transparent",
              "show_icons": true,
              "show": "prs_merged_percentage",
              "include_all_commits": true
            }
          path: assets/stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: >-
            {
              "username": "${{ github.repository_owner }}",
              "layout": "donut",
              "theme": "transparent",
              "langs_count": 5
            }
          path: assets/stats/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload stat cards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cards-stats
          path: assets/stats/*.svg
  generate-repository-pins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: rust-tpm2-cli
            owner: hyperfinitism
          - repo: enact-rs
            owner: hyperfinitism
          - repo: ortho
            owner: hyperfinitism
          - repo: ima-parser
            owner: hyperfinitism
          - repo: gh-contrib-stats
            owner: hyperfinitism
          - repo: license-logic
            owner: hyperfinitism
    steps:
      - name: Generate pin card for ${{ matrix.owner }}/${{ matrix.repo }}
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: pin
          options: >-
            {
              "username": "${{ matrix.owner }}",
              "repo": "${{ matrix.repo }}",
              "theme": "transparent"
            }
          path: assets/pins/${{ matrix.owner }}-${{ matrix.repo }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload pin card
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cards-pin-${{ matrix.owner }}-${{ matrix.repo }}
          path: assets/pins/*.svg
  commit-cards:
    needs: [generate-readme-stats, generate-repository-pins]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download stat cards
        if: ${{ needs.generate-readme-stats.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cards-stats
          path: assets/stats
      - name: Download pin cards
        if: ${{ needs.generate-repository-pins.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cards-pin-*
          path: assets/pins
          merge-multiple: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "assets: Update README cards" --signoff || exit 0
          git push
